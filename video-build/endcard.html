<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #0b0d10;
    color: #f3efe6;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .frame {
    position: absolute; inset: 70px;
    border: 1px solid rgba(200,166,99,0.28);
  }
  .frame::after {
    content: ''; position: absolute; inset: 10px;
    border: 1px solid rgba(200,166,99,0.12);
  }
  .thread {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(200,166,99,0.15) 18%, rgba(224,196,132,0.9) 50%, rgba(200,166,99,0.15) 82%, transparent 100%);
  }
  .thread::before {
    content: ''; position: absolute; left: 50%; top: -4px; width: 8px; height: 8px;
    transform: translateX(-50%) rotate(45deg);
    background: #e0c484;
  }
  .stack { text-align: center; transform: translateY(-108px); }
  .kicker {
    font-family: 'Courier New', monospace;
    font-size: 17px; letter-spacing: 0.62em; text-transform: uppercase;
    color: #c8a663; margin-bottom: 34px;
  }
  h1 {
    font-size: 128px; font-weight: 400; letter-spacing: 0.015em;
    color: #f3efe6;
  }
  h1 .gold { color: #e0c484; }
  .rule {
    width: 460px; height: 1px; margin: 38px auto;
    background: linear-gradient(90deg, transparent, rgba(200,166,99,0.75), transparent);
  }
  .tag {
    font-size: 30px; font-style: italic; color: #b9b2a4; letter-spacing: 0.04em;
  }
  .foot {
    position: absolute; bottom: 118px; left: 0; right: 0;
    text-align: center;
    font-family: 'Courier New', monospace; font-size: 14px;
    letter-spacing: 0.42em; text-transform: uppercase; color: #6f6a5e;
  }
  .pillars {
    position: absolute; bottom: 168px; left: 0; right: 0; text-align: center;
    font-family: 'Courier New', monospace; font-size: 13.5px;
    letter-spacing: 0.30em; text-transform: uppercase; color: #8b8577;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="thread"></div>
  <div class="stack">
    <div class="kicker">LoomGuard Pictures</div>
    <h1>Loom<span class="gold">Guard</span></h1>
    <div class="rule"></div>
    <div class="tag">The fabric of trust.</div>
  </div>
  <div class="pillars">Two-Stage Deterministic &times; AI Verification &nbsp;·&nbsp; PayPal Orders API v2 &nbsp;·&nbsp; 100% Provenance</div>
  <div class="foot">Pre-Publication Brand Governance</div>
</body>
</html>
